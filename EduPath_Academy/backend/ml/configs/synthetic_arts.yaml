# Versioned synthetic Arts learner / operational data configuration
generator_version: "0.1.0"
scenario_id: arts_al_baseline_v1
seed: 42
data_origin: synthetic_learner

population:
  n_students: 400
  n_teachers: 12
  time_horizon_days: 120
  start_date: "2025-01-06"
  grade: "A/L"
  mediums: [sinhala, english, tamil]
  age_bands: ["16-17", "17-18", "18-19"]

subjects:
  # Provisional Sri Lankan A/L Arts-oriented catalogue (not official syllabus adoption)
  provisional: true
  list:
    - { subject_id: sub_history, name: "History", medium: english }
    - { subject_id: sub_geography, name: "Geography", medium: english }
    - { subject_id: sub_economics, name: "Economics", medium: english }
    - { subject_id: sub_political, name: "Political Science", medium: english }
    - { subject_id: sub_sinhala_lit, name: "Sinhala Literature", medium: sinhala }

topics_per_subject: 8
resources_per_topic: 4
questions_per_topic: 6

proficiency:
  initial_mean: 0.45
  initial_std: 0.15
  learning_gain_mean: 0.03
  learning_gain_std: 0.02
  forgetting_rate_per_day: 0.002

activity:
  sessions_per_week_mean: 3.5
  sessions_per_week_std: 1.5
  available_study_minutes_mean: 90
  available_study_minutes_std: 30
  response_correctness_logit_scale: 2.0
  response_time_seconds_mean: 45
  response_time_seconds_std: 20

missingness:
  inactivity_rate: 0.08
  dropout_rate: 0.05
  late_join_rate: 0.1
  missing_assessment_rate: 0.07

teachers:
  slots_per_week: 6
  slot_duration_minutes: 30
  timezone: Asia/Colombo
  group_participation_rate: 0.4

scenarios:
  # Declared before evaluation — do not alter to chase test scores
  cold_start: { fraction: 0.1, max_events: 2 }
  sparse_history: { fraction: 0.15, max_events_per_week: 1 }
  improving: { fraction: 0.15, gain_multiplier: 2.0 }
  declining: { fraction: 0.1, gain_multiplier: -0.5 }
  inactive: { fraction: 0.08, activity_multiplier: 0.05 }
  late_joining: { fraction: 0.1, join_delay_days_mean: 30 }
  missing_data: { fraction: 0.1, miss_prob: 0.25 }

splits:
  train: 0.6
  validation: 0.2
  test: 0.2
  separate_seeds: true
  no_student_overlap: true

noise:
  event_jitter_seconds: 120
  score_noise_std: 0.05

parameter_sources:
  - "Heuristic estimates for A/L study patterns; NOT from institutional data"
  - "Activity rates loosely informed by public OULAD engagement literature (order-of-magnitude only)"
